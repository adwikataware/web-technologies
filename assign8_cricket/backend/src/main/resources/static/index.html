<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Cricket Score Center</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand">
        <span class="brand-mark" aria-hidden="true">🏏</span>
        <span class="brand-name">Live Cricket Score Center</span>
      </a>
      <div class="conn" id="conn-indicator">
        <span class="conn-dot" id="conn-dot"></span>
        <span id="conn-label">Connecting…</span>
      </div>
    </div>
  </header>

  <main class="page" id="app">
    <!-- Filled by app.js: either the match list or one match's live detail. -->
    <p class="loading">Loading matches…</p>
  </main>

  <footer class="footer">
    <p>Assignment 8 · Spring Boot, STOMP over WebSocket, a vanilla JS dashboard</p>
  </footer>

  <script src="js/vendor/sockjs.min.js"></script>
  <script src="js/vendor/stomp.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
