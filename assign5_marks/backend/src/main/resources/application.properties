spring.application.name=vit-semester-results

# Point this at any MongoDB - a local server or an Atlas connection string:
#   set MONGODB_URI=mongodb+srv://user:pass@cluster.mongodb.net/vit_results
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/vit_results}
spring.data.mongodb.auto-index-creation=true

server.port=8080

# Vite dev server.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
