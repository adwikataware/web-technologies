# Demo profile: downloads and runs a throwaway MongoDB on port 27017, so the API
# works without installing one. Data lives only as long as the process does.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=embedded
de.flapdoodle.mongodb.embedded.version=7.0.14
spring.data.mongodb.uri=mongodb://localhost:27017/vit_results
